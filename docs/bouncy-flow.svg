<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1B5FD6"/>
      <stop offset=".56" stop-color="#257EF4"/>
      <stop offset="1" stop-color="#5AA9FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F172A" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="#F7F7F5"/>
  <text x="64" y="76" fill="#111214" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="850" letter-spacing="-1.4">How Bouncy turns messy work into client-ready rhythm</text>
  <g filter="url(#cardShadow)">
    <rect x="64" y="124" width="310" height="284" rx="24" fill="#FFFFFF"/>
    <text x="92" y="168" fill="#257EF4" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="1.4">MESSY NOTE</text>
    <text x="92" y="212" fill="#111214" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">@tomboy finished</text>
    <text x="92" y="244" fill="#111214" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">welcome page, cards,</text>
    <text x="92" y="276" fill="#111214" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">AI assistant + try-on.</text>
    <text x="92" y="326" fill="#71717A" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500">don't send it all at once</text>
    <text x="92" y="356" fill="#71717A" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500">today: assistant first</text>
  </g>
  <path d="M400 264H496" stroke="#257EF4" stroke-width="6" stroke-linecap="round"/>
  <path d="M478 242L500 264L478 286" stroke="#257EF4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(520 116)">
    <circle cx="88" cy="88" r="74" fill="url(#blue)"/>
    <ellipse cx="63" cy="84" rx="11" ry="18" fill="#FAFAFA">
      <animate attributeName="ry" values="18;3;18" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="113" cy="84" rx="11" ry="18" fill="#FAFAFA">
      <animate attributeName="ry" values="18;3;18" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M59 131C75 145 102 145 118 131" stroke="#FAFAFA" stroke-width="7" stroke-linecap="round"/>
    <rect x="116" y="12" width="190" height="46" rx="23" fill="#FFFFFF" stroke="#E5E5E0"/>
    <circle cx="146" cy="35" r="5" fill="#257EF4">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="35" r="5" fill="#257EF4">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.1s" begin=".15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="194" cy="35" r="5" fill="#257EF4">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.1s" begin=".3s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="202" fill="#111214" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Bouncy</text>
    <text x="2" y="234" fill="#71717A" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500">reads tags, intent, and pacing</text>
  </g>
  <path d="M728 264H824" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
  <path d="M806 242L828 264L806 286" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#cardShadow)">
    <rect x="854" y="124" width="282" height="284" rx="24" fill="#FFFFFF"/>
    <text x="882" y="168" fill="#10B981" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="1.4">STRUCTURED OUTPUT</text>
    <rect x="882" y="196" width="226" height="38" rx="12" fill="#EAF2FE"/>
    <text x="900" y="221" fill="#257EF4" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Draft today: AI assistant</text>
