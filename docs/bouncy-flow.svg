    <text x="900" y="383" fill="#111214" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Undoable app actions</text>
  </g>
  <text x="64" y="464" fill="#71717A" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">One quick prompt can become logs, scheduled follow-ups, client-safe copy, and internal-only todos.</text>
